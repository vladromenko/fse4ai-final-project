
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test-wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint and build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "ruff>=0.9,<1"
          python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Run Ruff
        run: ruff check .

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

      - name: Test installed wheel from outside checkout
        shell: bash
        run: |
          set -euo pipefail

          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"

          python -m venv /tmp/fse-ci-venv

          /tmp/fse-ci-venv/bin/python -m pip install --upgrade pip
          /tmp/fse-ci-venv/bin/python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          /tmp/fse-ci-venv/bin/python -m pip install "pytest>=8,<10"
          /tmp/fse-ci-venv/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE/$WHEEL"

          cp -R tests /tmp/fse-ci-tests
          cd /tmp

          /tmp/fse-ci-venv/bin/python -m pytest -q /tmp/fse-ci-tests
